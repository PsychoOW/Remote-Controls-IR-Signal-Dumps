blueprint:
  name: IR Fernbedienung Controller
  description: >
    Steuere Home Assistant mit einer 20-Tasten IR Fernbedienung.
    Weise jeder Taste eine beliebige Aktion zu.
  domain: automation

  input:
    taste_1:  { name: "Taste 1",  default: [], selector: { action: {} } }
    taste_2:  { name: "Taste 2",  default: [], selector: { action: {} } }
    taste_3:  { name: "Taste 3",  default: [], selector: { action: {} } }
    taste_4:  { name: "Taste 4",  default: [], selector: { action: {} } }
    taste_5:  { name: "Taste 5",  default: [], selector: { action: {} } }
    taste_6:  { name: "Taste 6",  default: [], selector: { action: {} } }
    taste_7:  { name: "Taste 7",  default: [], selector: { action: {} } }
    taste_8:  { name: "Taste 8",  default: [], selector: { action: {} } }
    taste_9:  { name: "Taste 9",  default: [], selector: { action: {} } }
    taste_10: { name: "Taste 10", default: [], selector: { action: {} } }
    taste_11: { name: "Taste 11", default: [], selector: { action: {} } }
    taste_12: { name: "Taste 12", default: [], selector: { action: {} } }
    taste_13: { name: "Taste 13", default: [], selector: { action: {} } }
    taste_14: { name: "Taste 14", default: [], selector: { action: {} } }
    taste_15: { name: "Taste 15", default: [], selector: { action: {} } }
    taste_16: { name: "Taste 16", default: [], selector: { action: {} } }
    taste_17: { name: "Taste 17", default: [], selector: { action: {} } }
    taste_18: { name: "Taste 18", default: [], selector: { action: {} } }
    taste_19: { name: "Taste 19", default: [], selector: { action: {} } }
    taste_20: { name: "Taste 20", default: [], selector: { action: {} } }

mode: queued
max_exceeded: silent

trigger:
  - platform: event
    event_type: esphome.ir_fernbedienung

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '1' }}"
        sequence: !input taste_1
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '2' }}"
        sequence: !input taste_2
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '3' }}"
        sequence: !input taste_3
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '4' }}"
        sequence: !input taste_4
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '5' }}"
        sequence: !input taste_5
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '6' }}"
        sequence: !input taste_6
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '7' }}"
        sequence: !input taste_7
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '8' }}"
        sequence: !input taste_8
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '9' }}"
        sequence: !input taste_9
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '10' }}"
        sequence: !input taste_10
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '11' }}"
        sequence: !input taste_11
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '12' }}"
        sequence: !input taste_12
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '13' }}"
        sequence: !input taste_13
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '14' }}"
        sequence: !input taste_14
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '15' }}"
        sequence: !input taste_15
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '16' }}"
        sequence: !input taste_16
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '17' }}"
        sequence: !input taste_17
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '18' }}"
        sequence: !input taste_18
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '19' }}"
        sequence: !input taste_19
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.taste == '20' }}"
        sequence: !input taste_20
    default: []
