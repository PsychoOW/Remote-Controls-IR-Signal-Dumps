blueprint:
  name: IR Remote Controller
  description: >
    Control Home Assistant with a 20-button IR remote.
    Assign any action to each button.
  domain: automation

  input:
    button_1:  { name: "Button 1",  default: [], selector: { action: {} } }
    button_2:  { name: "Button 2",  default: [], selector: { action: {} } }
    button_3:  { name: "Button 3",  default: [], selector: { action: {} } }
    button_4:  { name: "Button 4",  default: [], selector: { action: {} } }
    button_5:  { name: "Button 5",  default: [], selector: { action: {} } }
    button_6:  { name: "Button 6",  default: [], selector: { action: {} } }
    button_7:  { name: "Button 7",  default: [], selector: { action: {} } }
    button_8:  { name: "Button 8",  default: [], selector: { action: {} } }
    button_9:  { name: "Button 9",  default: [], selector: { action: {} } }
    button_10: { name: "Button 10", default: [], selector: { action: {} } }
    button_11: { name: "Button 11", default: [], selector: { action: {} } }
    button_12: { name: "Button 12", default: [], selector: { action: {} } }
    button_13: { name: "Button 13", default: [], selector: { action: {} } }
    button_14: { name: "Button 14", default: [], selector: { action: {} } }
    button_15: { name: "Button 15", default: [], selector: { action: {} } }
    button_16: { name: "Button 16", default: [], selector: { action: {} } }
    button_17: { name: "Button 17", default: [], selector: { action: {} } }
    button_18: { name: "Button 18", default: [], selector: { action: {} } }
    button_19: { name: "Button 19", default: [], selector: { action: {} } }
    button_20: { name: "Button 20", default: [], selector: { action: {} } }

mode: queued
max_exceeded: silent

trigger:
  - platform: event
    event_type: esphome.ir_remote

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '1' }}"
        sequence: !input button_1
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '2' }}"
        sequence: !input button_2
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '3' }}"
        sequence: !input button_3
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '4' }}"
        sequence: !input button_4
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '5' }}"
        sequence: !input button_5
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '6' }}"
        sequence: !input button_6
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '7' }}"
        sequence: !input button_7
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '8' }}"
        sequence: !input button_8
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '9' }}"
        sequence: !input button_9
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '10' }}"
        sequence: !input button_10
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '11' }}"
        sequence: !input button_11
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '12' }}"
        sequence: !input button_12
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '13' }}"
        sequence: !input button_13
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '14' }}"
        sequence: !input button_14
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '15' }}"
        sequence: !input button_15
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '16' }}"
        sequence: !input button_16
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '17' }}"
        sequence: !input button_17
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '18' }}"
        sequence: !input button_18
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '19' }}"
        sequence: !input button_19
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.button == '20' }}"
        sequence: !input button_20
    default: []
